spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:printservice}
spring.datasource.username=${DB_USER:printservice}
spring.datasource.password=${DB_PASSWORD:printservice}
spring.datasource.hikari.connection-timeout=2000

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

jobs.worker.enabled=true
jobs.worker.poll-interval=5000
jobs.retry.max-retries=3
jobs.retry.backoff=PT30S
jobs.renderer.delay=PT0.5S
jobs.renderer.transient-failure-rate=0.25
