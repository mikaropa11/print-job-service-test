spring.datasource.url=jdbc:h2:mem:printservice;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-timeout=2000

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

jobs.worker.enabled=false
jobs.retry.max-retries=3
jobs.retry.backoff=PT30S
jobs.renderer.delay=PT0S
jobs.renderer.transient-failure-rate=0.0
