services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: postgres_db
    environment:
      POSTGRES_DB: printservice
      POSTGRES_USER: printservice
      POSTGRES_PASSWORD: printservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printservice -d printservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: printservice:latest
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: printservice
      DB_USER: printservice
      DB_PASSWORD: printservice
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
