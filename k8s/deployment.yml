apiVersion: apps/v1
kind: Deployment
metadata:
  name: printservice
  labels:
    app: printservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: printservice
  template:
    metadata:
      labels:
        app: printservice
    spec:
      containers:
        - name: printservice
          image: printservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: printservice-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: printservice-db
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: printservice-db
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: printservice-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: printservice-db
                  key: password
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi